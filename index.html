<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>そむごよみ</title>
<meta name="theme-color" content="#F8F5F0">
<meta name="description" content="私だけの「今年初めて」を記録するアプリ">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' fill='%23F8F5F0'/%3E%3Ccircle cx='96' cy='96' r='54' fill='%23B83B26'/%3E%3Ctext x='96' y='118' font-size='64' text-anchor='middle' fill='%23F8F5F0' font-family='serif'%3E%E5%88%9D%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#F8F5F0;
  --card:#FFFDF9;
  --ink:#3B3835;
  --muted:#6B645C;
  --shu:#B83B26;
  --line:#D9D1C4;
  --focus:#1F4E79;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"BIZ UDMincho","BIZ UDPMincho","UD デジタル 教科書体 N","Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  font-size:17px;
  line-height:1.7;
  padding-bottom:env(safe-area-inset-bottom,0);
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding:0 16px 40px}

/* header */
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top,0) + 16px) 0 8px}
.hd h1{margin:0;font-size:28px;letter-spacing:.2em;font-weight:700;line-height:1.3}
.hd p{margin:0;font-size:13px;color:var(--muted)}
.hd .tools{display:flex;gap:6px;flex-shrink:0}
.icon-btn{min-width:44px;min-height:44px;padding:0 10px;background:transparent;border:1px solid var(--line);border-radius:8px;font-weight:700}
.icon-btn:active{background:#EFE9DE}

/* year bar */
.yearbar{display:flex;align-items:center;justify-content:center;gap:6px;margin:8px 0}
.yearbar .y{min-width:120px;text-align:center;font-weight:700;font-size:20px}
.yearbar .y small{display:block;font-size:12px;font-weight:400;color:var(--muted);line-height:1.2}
.nav-btn{min-width:44px;min-height:44px;background:var(--card);border:1px solid var(--line);border-radius:8px;font-size:18px}
.nav-btn:disabled{opacity:.35;cursor:default}
.nav-btn:active:not(:disabled){background:#EFE9DE}
.now-btn{min-height:44px;padding:0 12px;background:transparent;border:1px solid var(--line);border-radius:8px;font-size:14px}

/* tabs */
.tabs{display:flex;gap:4px;margin:8px 0 12px;border-bottom:2px solid var(--ink)}
.tab{flex:1;min-height:48px;padding:4px 2px;background:transparent;border:0;border-bottom:4px solid transparent;margin-bottom:-2px;font-weight:700;line-height:1.25}
.tab small{display:block;font-size:11px;font-weight:400;color:var(--muted)}
.tab[aria-selected="true"]{border-bottom-color:var(--shu);background:#F0EADF}
.tab[aria-selected="true"]::before{content:"◆";color:var(--shu);font-size:9px;display:block;line-height:1}

/* cards */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.card{display:flex;align-items:stretch;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px}
.stamp{flex:0 0 56px;width:56px;min-height:56px;border-radius:50%;align-self:center;display:flex;align-items:center;justify-content:center;
  background:transparent;border:2px dashed var(--muted);color:var(--muted);font-size:14px;font-weight:700;padding:0}
.stamp.on{background:var(--shu);border:2px solid var(--shu);color:#FFF;font-size:22px;box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px var(--shu)}
.stamp.restore{border:2px solid var(--ink);color:var(--ink);border-radius:10px;font-size:14px}
.stamp.pop{animation:pop .28s ease-out}
@keyframes pop{0%{transform:scale(1.5);opacity:.2}100%{transform:scale(1);opacity:1}}
.body{flex:1;min-height:56px;text-align:left;background:transparent;border:0;padding:4px 6px;border-radius:8px}
.body:active{background:#F0EADF}
.body .nm{display:block;font-size:17px;font-weight:600;line-height:1.5}
.body .mt{display:block;font-size:13px;color:var(--muted);line-height:1.5}
.body .mt b{color:var(--ink);font-weight:700}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}
.add-btn{display:block;width:100%;min-height:48px;margin-top:14px;background:transparent;border:1px dashed var(--muted);border-radius:10px;color:var(--ink)}
.foot{margin-top:28px;font-size:12px;color:var(--muted);text-align:center}

/* buttons */
.btn{display:block;width:100%;min-height:48px;margin:8px 0 0;padding:6px 14px;background:var(--card);border:1px solid var(--ink);border-radius:10px;font-weight:600}
.btn.primary{background:var(--shu);border-color:var(--shu);color:#FFF}
.btn.danger{border-color:var(--shu);color:var(--shu)}
.btn.quiet{width:auto;display:inline-block;min-height:44px;margin:4px 6px 0 0;border:1px solid var(--line);font-weight:400;font-size:15px}
.btn:active{filter:brightness(.92)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.row{display:flex;gap:8px}
.row .btn{margin-top:8px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(59,56,53,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.box{background:var(--bg);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 18px calc(env(safe-area-inset-bottom,0) + 20px)}
@media(min-width:600px){.ov{align-items:center}.box{border-radius:16px}}
.box .mh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.box .mh h2{margin:0;font-size:20px;line-height:1.4}
.box h3{margin:18px 0 4px;font-size:15px;border-left:4px solid var(--shu);padding-left:8px}
.box p{margin:6px 0}
.box .sub{font-size:13px;color:var(--muted)}
.box .status{font-weight:700}
.box ul.hist{margin:4px 0;padding:0;list-style:none;border-top:1px solid var(--line)}
.box ul.hist li{padding:8px 4px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.box label{display:block;font-size:14px;margin-top:10px}
.box input[type=date],.box input[type=text],.box input[type=password],.box select{width:100%;min-height:48px;padding:6px 10px;background:var(--card);border:1px solid var(--ink);border-radius:8px}
.box .guide p{font-size:15px}

/* lock */
.lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.lock h2{margin:0 0 4px;letter-spacing:.2em}
.lock .dots{display:flex;gap:16px;margin:18px 0 6px;font-size:28px;color:var(--shu);min-height:44px;align-items:center}
.lock .msg{min-height:26px;color:var(--shu);font-size:15px;margin:0 0 10px;text-align:center}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pad button{width:72px;height:64px;background:var(--card);border:1px solid var(--ink);border-radius:12px;font-size:24px;font-weight:700}
.pad button:active{background:#EFE9DE}
.pad .ph{visibility:hidden}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0) + 24px);transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:24px;font-size:15px;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}

@media (prefers-reduced-motion:reduce){
  .stamp.pop{animation:none}
  #toast{transition:none}
}
</style>
</head>

  var SK = {};
  SEASONS.forEach(function (s) { SK[s.k] = s; });

  var PRESETS = {
    spring: [

      '朝起きるのが少し楽になる',

      '節分の豆を見かける／豆まきをする',
      'バレンタインの特設コーナーを見かける'
    ]
  };

  var KEY = 'somugoyomi_v1';
  var NOW = new Date();
  var CUR = NOW.getFullYear();
  var mem = null;          // localStorage が使えない場合の一時退避
  var state, view, items = [], byId = {}, lastStamped = null;
  var modalRoot = null, lastFocus = null, lockKeyHandler = null;

  /* ---------- ユーティリティ ---------- */
  function $(s) { return document.querySelector(s); }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function h(tag, props) {
    var e = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    });
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c === null || c === undefined || c === false) continue;
      if (Array.isArray(c)) { c.forEach(function (cc) { if (cc) e.appendChild(typeof cc === 'string' ? document.createTextNode(cc) : cc); }); }
      else e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    }
    return e;
  }
  function seasonOfMonth(m) {
    if (m >= 3 && m <= 5) return 'spring';
    if (m >= 6 && m <= 8) return 'summer';
    if (m >= 9 && m <= 11) return 'autumn';
    return 'winter';
  }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  var KD = '〇一二三四五六七八九';
  function kn(n) {
    if (n < 10) return KD.charAt(n);
    if (n === 10) return '十';
    if (n < 20) return '十' + KD.charAt(n - 10);
    var t = Math.floor(n / 10), o = n % 10;
    return KD.charAt(t) + '十' + (o ? KD.charAt(o) : '');
  }
  function fmtDate(d) {
    var m = parseInt(d.slice(5, 7), 10), dd = parseInt(d.slice(8, 10), 10);
    return state.set.kanji ? kn(m) + '月' + kn(dd) + '日' : m + '/' + dd;
  }
  function yl(y) { return y === CUR ? '今年' : y + '年'; }
  function prevLabel(y) { return y === CUR ? '昨年' : (y - 1) + '年'; }
  function defDate(y) {
    var t = new Date(), m = t.getMonth() + 1, d = t.getDate();
    var s = y + '-' + pad2(m) + '-' + pad2(d);
    var chk = new Date(y, m - 1, d);
    if (chk.getMonth() !== m - 1) s = y + '-' + pad2(m) + '-28';
    return s;
  }
  function vibrate() { try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {} }
  var toastTimer = null;
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }

  /* ---------- 保存・読込 ---------- */
  function normalize(o, keepPass) {
    var s = { rec: {}, custom: [], order: {}, set: { pass: keepPass || '', kanji: false } };
    try {
      if (o && typeof o === 'object') {
        if (o.rec && typeof o.rec === 'object') {
          Object.keys(o.rec).forEach(function (id) {
            var yrs = o.rec[id];
            if (!yrs || typeof yrs !== 'object') return;
            Object.keys(yrs).forEach(function (y) {
              if (!/^\d{4}$/.test(y)) return;
              var v = yrs[y];
              if (!v || typeof v !== 'object') return;
              var rec = null;
              if (v.skip === true) rec = { skip: true };
              else if (typeof v.d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v.d) && v.d.slice(0, 4) === y) rec = { d: v.d };
              if (rec) { if (!s.rec[id]) s.rec[id] = {}; s.rec[id][y] = rec; }
            });
          });
        }
        if (Array.isArray(o.custom)) {
          o.custom.forEach(function (c) {
            if (c && typeof c.id === 'string' && typeof c.name === 'string' && SK[c.season] && c.name.trim()) {
              s.custom.push({ id: c.id.slice(0, 40), name: c.name.slice(0, 60), season: c.season });
            }
          });
        }
        if (o.order && typeof o.order === 'object') {
          SEASONS.forEach(function (se) {
            if (Array.isArray(o.order[se.k])) {
              s.order[se.k] = o.order[se.k].filter(function (x) { return typeof x === 'string'; });
            }
          });
        }
        if (o.set && typeof o.set === 'object') {
          s.set.kanji = o.set.kanji === true;
          if (keepPass === undefined && typeof o.set.pass === 'string' && /^\d{4}$/.test(o.set.pass)) s.set.pass = o.set.pass;
        }
      }
    } catch (e) {}
    return s;
  }
  function load() {
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; }
    if (raw) {
      try { return normalize(JSON.parse(raw)); } catch (e) {}
    }
    return normalize(mem);
  }
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {
      try { mem = JSON.parse(JSON.stringify(state)); } catch (e2) {}
      toast('この環境では保存できません（画面を閉じると消えます）');
    }
  }

  /* ---------- 項目・記録 ---------- */
  function buildItems() {
    items = []; byId = {};
    function add(it) { items.push(it); byId[it.id] = it; }
    SEASONS.forEach(function (s) {
      PRESETS[s.k].forEach(function (n, i) { add({ id: s.p + (i + 1), name: n, season: s.k, custom: false }); });
    });
    state.custom.forEach(function (c) { add({ id: c.id, name: c.name, season: c.season, custom: true }); });
  }
  function orderedIds(season) {
    var base = items.filter(function (it) { return it.season === season; }).map(function (it) { return it.id; });
    var ord = state.order[season] || [], seen = {}, out = [];
    ord.forEach(function (id) { if (base.indexOf(id) >= 0 && !seen[id]) { seen[id] = 1; out.push(id); } });
    base.forEach(function (id) { if (!seen[id]) out.push(id); });
    return out;
  }
  function getRec(id, y) { return state.rec[id] ? state.rec[id][y] : undefined; }
  function setRec(id, y, val) {
    if (!state.rec[id]) state.rec[id] = {};
    if (val === null) {
      delete state.rec[id][y];
      if (!Object.keys(state.rec[id]).length) delete state.rec[id];
    } else {
      state.rec[id][y] = val;
    }
    save();
  }
  function visibleIds(season, y) {
    return orderedIds(season).filter(function (id) { var r = getRec(id, y); return !(r && r.skip); });
  }
  function skippedIds(y) {
    var out = [];
    SEASONS.forEach(function (s) {
      orderedIds(s.k).forEach(function (id) { var r = getRec(id, y); if (r && r.skip) out.push(id); });
    });
    return out;
  }
  function move(id, dir) {
    var it = byId[id]; if (!it) return;
    var ord = orderedIds(it.season), vis = visibleIds(it.season, view.year);
    var i = vis.indexOf(id), j = i + dir;
    if (i < 0 || j < 0 || j >= vis.length) return;
    var a = ord.indexOf(id), b = ord.indexOf(vis[j]);
    var tmp = ord[a]; ord[a] = ord[b]; ord[b] = tmp;
    state.order[it.season] = ord;
    save(); render();
  }
  function stampIt(id, y, d) {
    if (!d || d.slice(0, 4) !== String(y)) { toast(y + '年の日付を選んでください'); return false; }
    setRec(id, y, { d: d });
    lastStamped = id;
    vibrate();
    return true;
  }

  /* ---------- モーダル ---------- */
  function closeModal() {
    if (modalRoot && modalRoot.parentNode) modalRoot.parentNode.removeChild(modalRoot);
    modalRoot = null;
    try { if (lastFocus && document.body.contains(lastFocus)) lastFocus.focus(); } catch (e) {}
  }
  function openModal(title, body) {
    var keep = modalRoot ? lastFocus : document.activeElement;
    if (modalRoot && modalRoot.parentNode) modalRoot.parentNode.removeChild(modalRoot);
    modalRoot = null;
    lastFocus = keep;
    var closeBtn = h('button', { class: 'icon-btn', type: 'button', 'aria-label': '閉じる', onclick: closeModal, text: '閉じる' });
    var box = h('div', { class: 'box' },
      h('div', { class: 'mh' }, h('h2', { text: title }), closeBtn),
      body);
    var ov = h('div', { class: 'ov', role: 'dialog', 'aria-modal': 'true', 'aria-label': title }, box);
    ov.addEventListener('click', function (e) { if (e.target === ov) closeModal(); });
    document.body.appendChild(ov);
    modalRoot = ov;
    try { closeBtn.focus(); } catch (e) {}
    return ov;
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && modalRoot) closeModal();
  });
  function btn(label, cls, fn) {
    return h('button', { type: 'button', class: 'btn' + (cls ? ' ' + cls : ''), onclick: fn, text: label });
  }
  function confirmModal(msg, okLabel, onOk) {
    var body = h('div', {},
      h('p', { text: msg }),
      btn(okLabel, 'danger', function () { closeModal(); onOk(); }),
      btn('やめる', '', closeModal));
    openModal('確認', body);
  }

  /* ---------- 詳細ダイアログ ---------- */
  function openDetail(id) {
    var it = byId[id]; if (!it) return;
    var y = view.year, r = getRec(id, y);
    var body = h('div', {});
    body.appendChild(h('p', { class: 'sub', text: SK[it.season].n + 'の項目' + (it.custom ? '（自分で追加）' : '') }));
    var st;
    if (r && r.d) st = yl(y) + '：' + fmtDate(r.d) + ' に記録';

    body.appendChild(h('p', { class: 'status', text: st }));

    if (!(r && r.skip)) {

      body.appendChild(h('label', { for: 'dt', text: '日付（' + y + '年）' }));
      body.appendChild(input);
      body.appendChild(btn(r && r.d ? '日付を更新する' : '今年初めて：この日に押す'.replace('今年', yl(y)), 'primary', function () {
        if (!input.value) { toast('日付を選んでください'); return; }

      }));

    } else {
      body.appendChild(btn('見送りをやめて元に戻す', 'primary', function () {
        setRec(id, y, null); closeModal(); render(); toast('元の季節へ戻しました');
      }));
    }

    body.appendChild(h('h3', { text: '歴代の記録' }));
    var yrs = state.rec[id] ? Object.keys(state.rec[id]).sort().reverse() : [];
    if (!yrs.length) {
      body.appendChild(h('p', { class: 'sub', text: 'まだ記録はありません。' }));
    } else {
      var ul = h('ul', { class: 'hist' });
      yrs.forEach(function (yy) {
        var v = state.rec[id][yy];

      });
      body.appendChild(ul);
    }

      body.appendChild(h('div', { class: 'row' },
        h('button', { type: 'button', class: 'btn', text: '↑ 上へ', disabled: idx === 0 ? true : null, onclick: function () { closeModal(); move(id, -1); } }),
        h('button', { type: 'button', class: 'btn', text: '↓ 下へ', disabled: idx === vis.length - 1 ? true : null, onclick: function () { closeModal(); move(id, 1); } })));
    }
    if (it.custom) {
      body.appendChild(h('h3', { text: '自分で追加した項目' }));
      body.appendChild(btn('名前を変更する', '', function () { openNameDialog('rename', id); }));
      body.appendChild(btn('この項目を削除する', 'danger', function () {
        confirmModal('「' + it.name + '」と、その記録をすべて削除します。', '削除する', function () {
          state.custom = state.custom.filter(function (c) { return c.id !== id; });
          delete state.rec[id];
          Object.keys(state.order).forEach(function (k) { state.order[k] = state.order[k].filter(function (x) { return x !== id; }); });
          save(); buildItems(); render(); toast('削除しました');
        });
      }));
    }
    openModal(it.name, body);
  }

  function openNameDialog(mode, id) {
    var it = mode === 'rename' ? byId[id] : null;
    var body = h('div', {});
    var input = h('input', { type: 'text', id: 'nm', maxlength: '40', value: it ? it.name : '', autocomplete: 'off' });
    body.appendChild(h('label', { for: 'nm', text: '項目の名前' }));
    body.appendChild(input);
    var sel = null;
    if (mode === 'add') {
      sel = h('select', { id: 'se' });
      var def = view.tab === 'skip' ? seasonOfMonth(NOW.getMonth() + 1) : view.tab;
      SEASONS.forEach(function (s) {
        var o = h('option', { value: s.k, text: s.n + '（' + s.r + '）' });
        if (s.k === def) o.selected = true;
        sel.appendChild(o);
      });
      body.appendChild(h('label', { for: 'se', text: '季節' }));
      body.appendChild(sel);
    }
    body.appendChild(btn(mode === 'add' ? '追加する' : '変更する', 'primary', function () {

        state.custom.push({ id: nid, name: name, season: sel.value });
        view.tab = sel.value;
        toast('追加しました');
      } else {
        state.custom.forEach(function (c) { if (c.id === id) c.name = name; });
        toast('変更しました');
      }
      save(); buildItems(); closeModal(); render();
    }));
    openModal(mode === 'add' ? '項目を追加' : '名前を変更', body);
  }

  /* ---------- 設定・ヘルプ ---------- */

      h('h3', { text: 'データについて' }),

    openModal('使い方', g);
  }

  function openSettings() {
    var body = h('div', {});

    body.appendChild(h('div', { class: 'row' },
      h('button', { type: 'button', class: 'btn', 'aria-pressed': state.set.kanji ? 'false' : 'true', text: (state.set.kanji ? '' : '✓ ') + '標準（3/15）', onclick: function () { state.set.kanji = false; save(); render(); openSettings(); } }),
      h('button', { type: 'button', class: 'btn', 'aria-pressed': state.set.kanji ? 'true' : 'false', text: (state.set.kanji ? '✓ ' : '') + '和数字（三月十五日）', onclick: function () { state.set.kanji = true; save(); render(); openSettings(); } })));
    // パスコード
    body.appendChild(h('h3', { text: 'パスコードロック' }));

    if (!state.set.pass) {
      body.appendChild(btn('4桁のパスコードを設定する', '', openPassSetup));
    } else {
      body.appendChild(btn('パスコードを変更する', '', openPassSetup));
      body.appendChild(btn('パスコードをオフにする', '', function () {
        confirmModal('パスコードロックをオフにします。', 'オフにする', function () {
          state.set.pass = ''; save(); toast('ロックをオフにしました');
        });
      }));
      body.appendChild(btn('今すぐロックする', '', function () { closeModal(); showLock(); }));
    }
    // バックアップ
    body.appendChild(h('h3', { text: 'バックアップ' }));

    body.appendChild(h('button', { type: 'button', class: 'btn quiet', text: '記録を書き出す', onclick: doExport }));
    body.appendChild(h('button', { type: 'button', class: 'btn quiet', text: '記録を読み込む', onclick: function () { file.click(); } }));

    openModal('設定', body);
  }

  function openPassSetup() {
    var body = h('div', {});
    var a = h('input', { type: 'password', id: 'p1', inputmode: 'numeric', pattern: '[0-9]*', maxlength: '4', autocomplete: 'off' });
    var b = h('input', { type: 'password', id: 'p2', inputmode: 'numeric', pattern: '[0-9]*', maxlength: '4', autocomplete: 'off' });
    body.appendChild(h('label', { for: 'p1', text: '新しいパスコード（数字4桁）' }));
    body.appendChild(a);
    body.appendChild(h('label', { for: 'p2', text: 'もう一度入力' }));
    body.appendChild(b);
    body.appendChild(h('p', { class: 'sub', text: '忘れるとアプリを開けなくなります。書き出したバックアップを保管しておくと安心です。' }));
    body.appendChild(btn('登録する', 'primary', function () {
      if (!/^\d{4}$/.test(a.value)) { toast('数字4桁で入力してください'); return; }
      if (a.value !== b.value) { toast('2つの入力が一致しません'); return; }
      state.set.pass = a.value; save(); closeModal(); toast('パスコードを設定しました');
    }));
    openModal('パスコードの設定', body);
  }

  function exportJson() {
    return JSON.stringify({
      app: 'somugoyomi', version: 1, exportedAt: new Date().toISOString(),
      data: { rec: state.rec, custom: state.custom, order: state.order, set: { kanji: state.set.kanji } }
    }, null, 2);
  }
  function doExport() {
    var json = exportJson();
    try {
      var blob = new Blob([json], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = h('a', { href: url, download: 'somugoyomi-' + todayStr() + '.json' });
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { try { URL.revokeObjectURL(url); } catch (e) {} }, 2000);
      toast('書き出しました');
    } catch (e) {
      showExportText(json);
    }
  }
  function showExportText(json) {
    var ta = h('textarea', { readonly: 'readonly', 'aria-label': '記録データ', style: 'width:100%;min-height:200px;font-size:13px;font-family:monospace;padding:8px;border:1px solid var(--ink);border-radius:8px;background:var(--card);color:var(--ink)' });
    ta.value = json;
    var body = h('div', {},
      h('p', { class: 'sub', text: '全体を選択してコピーし、メモなどに保管してください。' }),
      ta,
      btn('すべて選択', '', function () { try { ta.focus(); ta.select(); } catch (e) {} }));
    openModal('記録データ', body);
  }
  function importFile(input) {
    var f = input.files && input.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onerror = function () { toast('ファイルを読み込めませんでした'); };
    rd.onload = function () {
      var obj;
      try { obj = JSON.parse(String(rd.result)); } catch (e) { toast('JSONとして読み込めませんでした'); return; }
      var data = obj && obj.data ? obj.data : obj;
      if (!data || typeof data !== 'object' || typeof data.rec !== 'object' || data.rec === null) { toast('そむごよみのデータではありません'); return; }
      confirmModal('現在の記録を、読み込んだデータで置き換えます。よろしいですか？', '置き換える', function () {
        state = normalize(data, state.set.pass);
        save(); buildItems(); render(); toast('読み込みました');
      });
    };
    try { rd.readAsText(f); } catch (e) { toast('ファイルを読み込めませんでした'); }
    input.value = '';
  }

  /* ---------- パスコードロック ---------- */
  function showLock() {
    if (!state.set.pass) return;
    if (document.querySelector('.lock')) return;
    closeModal();
    var app = $('#app');
    app.setAttribute('aria-hidden', 'true');
    try { app.inert = true; } catch (e) {}
    var buf = '';
    var dots = h('div', { class: 'dots', 'aria-hidden': 'true' });
    var msg = h('p', { class: 'msg', role: 'alert' });
    function drawDots() {
      dots.textContent = '';
      for (var i = 0; i < 4; i++) dots.appendChild(h('span', { text: i < buf.length ? '●' : '○' }));
    }
    function unlock() {
      document.removeEventListener('keydown', lockKeyHandler);
      lockKeyHandler = null;
      if (ov.parentNode) ov.parentNode.removeChild(ov);
      app.removeAttribute('aria-hidden');
      try { app.inert = false; } catch (e) {}
    }
    function press(d) {
      if (buf.length >= 4) return;
      buf += d; msg.textContent = ''; drawDots(); vibrate();
      if (buf.length === 4) {
        setTimeout(function () {
          if (buf === state.set.pass) unlock();
          else { buf = ''; drawDots(); msg.textContent = '違います。もう一度どうぞ。'; }
        }, 120);
      }
    }
    function back() { buf = buf.slice(0, -1); drawDots(); }
    var pad = h('div', { class: 'pad' });
    ['1', '2', '3', '4', '5', '6', '7', '8', '9'].forEach(function (d) {
      pad.appendChild(h('button', { type: 'button', text: d, 'aria-label': d, onclick: function () { press(d); } }));
    });
    pad.appendChild(h('button', { type: 'button', class: 'ph', tabindex: '-1', 'aria-hidden': 'true' }));
    pad.appendChild(h('button', { type: 'button', text: '0', 'aria-label': '0', onclick: function () { press('0'); } }));
    pad.appendChild(h('button', { type: 'button', text: '⌫', 'aria-label': '一文字消す', onclick: back }));
    var ov = h('div', { class: 'lock', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'パスコード入力' },
      h('h2', { text: 'そむごよみ' }),
      h('p', { class: 'sub', text: 'パスコードを入力してください' }),
      dots, msg, pad);
    document.body.appendChild(ov);
    drawDots();
    lockKeyHandler = function (e) {
      if (/^[0-9]$/.test(e.key)) press(e.key);
      else if (e.key === 'Backspace') back();
    };
    document.addEventListener('keydown', lockKeyHandler);
  }

  /* ---------- 画面描画 ---------- */
  function cardNode(it, y, skipMode) {

      stampBtn = h('button', { type: 'button', class: 'stamp restore', 'aria-label': it.name + ' を元の季節に戻す', text: '戻す', onclick: function () {

      } });

      stampBtn = h('button', { type: 'button', class: 'stamp on' + (lastStamped === it.id ? ' pop' : ''), 'aria-label': it.name + '：' + fmtDate(r.d) + ' に記録済み。詳細を開く', text: '印', onclick: function () { openDetail(it.id); } });
    } else {
      stampBtn = h('button', { type: 'button', class: 'stamp', 'aria-label': it.name + ' に今年初めての朱印を押す', text: '押す', onclick: function () {

      } });

    var meta = [];

    } else {
      meta.push(h('span', { class: 'mt' }, yl(y) + '：', h('b', { text: r && r.d ? fmtDate(r.d) : '未記録' })));
    }
    var ptxt = pr ? (pr.skip ? '見送り' : fmtDate(pr.d)) : '記録なし';
    meta.push(h('span', { class: 'mt', text: prevLabel(y) + '：' + ptxt }));
    var body = h('button', { type: 'button', class: 'body', 'aria-label': it.name + ' の詳細', onclick: function () { openDetail(it.id); } },
      h('span', { class: 'nm', text: it.name }), meta);
    return h('li', { class: 'card' }, stampBtn, body);
  }

  function render() {
    var app = $('#app');
    app.textContent = '';
    var y = view.year;

    app.appendChild(h('header', { class: 'hd' },
      h('div', {}, h('h1', { text: 'そむごよみ' }), h('p', { text: '私だけの「今年初めて」を記録するアプリ' })),
      h('div', { class: 'tools' },
        h('button', { type: 'button', class: 'icon-btn', 'aria-label': '使い方', text: '？', onclick: openHelp }),

    var yb = h('div', { class: 'yearbar' },
      h('button', { type: 'button', class: 'nav-btn', 'aria-label': '前の年', text: '◀', disabled: y <= 2000 ? true : null, onclick: function () { view.year--; render(); } }),
      h('div', { class: 'y', 'aria-live': 'polite' }, y + '年', h('small', { text: y === CUR ? '今年' : (y === CUR - 1 ? '昨年' : '過去の年') })),

    if (y !== CUR) yb.appendChild(h('button', { type: 'button', class: 'now-btn', text: '今年へ', onclick: function () { view.year = CUR; render(); } }));

    var tabs = h('div', { class: 'tabs', role: 'tablist', 'aria-label': '季節' });
    SEASONS.forEach(function (s) {
      tabs.appendChild(h('button', { type: 'button', class: 'tab', role: 'tab', 'aria-selected': view.tab === s.k ? 'true' : 'false', onclick: function () { view.tab = s.k; render(); } },
        s.n, h('small', { text: s.r })));
    });
    tabs.appendChild(h('button', { type: 'button', class: 'tab', role: 'tab', 'aria-selected': view.tab === 'skip' ? 'true' : 'false', onclick: function () { view.tab = 'skip'; render(); } },
      '見送り', h('small', { text: skippedIds(y).length + '件' })));

    var list = h('ul', { class: 'list', role: 'tabpanel' });

      app.appendChild(h('button', { type: 'button', class: 'add-btn', text: '＋ 自分の項目を追加する', onclick: function () { openNameDialog('add'); } }));
    }
    app.appendChild(h('p', { class: 'foot', text: '記録はこの端末のブラウザにだけ保存されます' }));
    lastStamped = null;
  }

  /* ---------- 起動 ---------- */
  try { state = load(); } catch (e) { state = normalize(null); }
  view = { tab: seasonOfMonth(NOW.getMonth() + 1), year: CUR };
  buildItems();
  render();
  showLock();

  try {
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    }
  } catch (e) {}
});
</script>
</body>
</html>
